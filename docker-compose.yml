name: fraud-engine-app
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # Unique ID for this broker/controller node in the cluster
      # We could also provide a CLUSTER_ID, but a default auto-generated one is always supplied
      # It's just `1` since we have a single-node setup
      KAFKA_NODE_ID: 1 
      # We tell this node to act as both a message broker and a controller
      KAFKA_PROCESS_ROLES: broker,controller
      # Defines which interfaces/ports Kafka listens on inside the container - plaintext is for unencrypted, unauthenticated
      # (port 9092 is client traffic from the host machine, 29092 is client traffic from other containers, 9093 is controller internal traffic)
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      # The address Kafka tells clients to connect to - localhost:9092 for tools running on the host,
      # kafka:29092 for other containers on fraud-engine-app-network (their own "localhost" isn't this container)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      # Maps our custom PLAINTEXT_INTERNAL listener name to an actual protocol, since Kafka only infers this automatically for standard names
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - fraud-engine-app-network
    
  kafka-ui: 
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports: 
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=localCluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - fraud-engine-app-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9363:9363" # Prometheus metrics endpoint
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "default"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    # Override the container's resource limits, normally these numbers are quiet low I believe, here we raise the limit on open file descriptors
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - fraud-engine-app-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    restart: unless-stopped
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - clickhouse
    networks:
      - fraud-engine-app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # risk_engine/stream_processor run on the host during dev (for now)
    # so Prometheus needs host.docker.internal to reach their /metrics ports from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fraud-engine-app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
      - clickhouse
    networks:
      - fraud-engine-app-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command:
      - "--kafka.server=kafka:29092"
      - "--kafka.version=3.7.0"
    ports:
      - "9308:9308"
    restart: unless-stopped
    depends_on:
      - kafka
    networks:
      - fraud-engine-app-network

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    # Needs the host's network/PID namespace to report host-level (not container-level) metrics.
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped
    networks:
      - fraud-engine-app-network

