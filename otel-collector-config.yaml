receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 2048
  batch:
    send_batch_size: 1024
    timeout: 1s

exporters:
  clickhouse:
    endpoint: http://clickhouse:8123
    username: default
    password: default
    database: otel
    create_schema: true 
    ttl: 72h
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 8192
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

# This keeps the collector scoped to traces/logs only
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
